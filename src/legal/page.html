<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}} — Alondra1</title>
  <meta name="description" content="{{DESCRIPTION}}">
  {{ROBOTS_META}}
  <link rel="canonical" href="{{SITE_URL}}{{PATH}}">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="{{CSS}}">
  {{ANALYTICS}}
</head>
<body class="legal-page">
  <header class="site-header" id="top">
    <div class="container header-inner">
      <a class="brand" href="/" aria-label="Alondra1 home">
        <img src="/images/alondra1-logo-96.png" alt="" width="36" height="36">
        <span>Alondra1</span>
      </a>
    </div>
  </header>

  <main class="legal container" id="main">
    {{DRAFT_NOTICE}}
    {{BODY}}
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <a class="brand brand--footer" href="/" aria-label="Alondra1 home">
        <img src="/images/alondra1-logo-96.png" alt="" width="28" height="28" loading="lazy">
        <span>Alondra1</span>
      </a>
      <ul class="footer-links">{{FOOTER_LINKS}}</ul>
      {{COOKIE_SETTINGS}}
      <p class="copyright">© {{YEAR}} Alondra1</p>
    </div>
  </footer>

  {{CONSENT_BANNER}}
</body>
</html>
