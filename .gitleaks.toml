# Default gitleaks rules, plus known non-secrets.
[extend]
useDefault = true

[allowlist]
description = "Public values that look like keys"
regexes = [
  # SHA-512 of nginx.org's public package signing key (Dockerfile NGINX_KEY_SHA512): a checksum, not a secret.
  '''e09fa32f0a0eab2b879ccbbc4d0e4fb9751486eedda75e35fac65802cc9faa266425edf83e261137a2f4d16281ce2c1a5f4502930fe75154723da014214f0655''',
]
