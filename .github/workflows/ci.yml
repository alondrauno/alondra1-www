name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: {}  # the release workflow runs every check first

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Content and page tests
        run: python -I -m unittest discover -s tests -t . -v
      - name: Build (dev and prod variants)
        run: python -I build.py --out dist
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Validate HTML
        run: npx --yes html-validate@9 dist/dev/index.html dist/dev/404.html dist/prod/index.html dist/prod/404.html
      - name: Check links (built site and Markdown; local files only)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --offline --no-progress --root-dir "${{ github.workspace }}/dist/prod" 'dist/prod/**/*.html' './*.md' './docs/**/*.md'
          fail: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site
          path: dist

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image
        run: docker build -t alondra1-landing:ci .
      - name: Smoke test both variants (read-only, as deployed)
        run: |
          run() { docker run -d --name "landing-$1" -e ALONDRA1_ENVIRONMENT="$1" -p "127.0.0.1:$2:8080" --read-only \
            --tmpfs /tmp --tmpfs /etc/nginx/conf.d:uid=101,gid=101 --cap-drop ALL --security-opt no-new-privileges:true alondra1-landing:ci; }
          run prod 8080; run dev 8081
          for port in 8080 8081; do for i in $(seq 1 20); do curl -fsS "http://127.0.0.1:$port/healthz" && break; sleep 1; done; done
          test "$(curl -fsS http://127.0.0.1:8080/healthz)" = "ok"
          curl -fsS http://127.0.0.1:8080/ | grep -q 'Organize your day.'
          curl -fsS http://127.0.0.1:8080/ | grep -q '<link rel="canonical" href="https://alondra1.com/">'
          curl -fsS http://127.0.0.1:8081/ | grep -q '<link rel="canonical" href="https://dev.alondra1.com/">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/missing)" = 404
          prod="$(curl -fsSI http://127.0.0.1:8080/)"; dev="$(curl -fsSI http://127.0.0.1:8081/)"
          echo "$prod" | grep -qi '^content-security-policy:'
          echo "$prod" | grep -qi '^x-content-type-options: nosniff'
          ! echo "$prod" | grep -qi '^server: nginx/'
          ! echo "$prod" | grep -qi '^x-robots-tag:'
          echo "$dev" | grep -qi '^x-robots-tag: noindex, nofollow'
          curl -fsS http://127.0.0.1:8081/robots.txt | grep -q 'Disallow: /'
          css="$(curl -fsS http://127.0.0.1:8080/ | grep -o '/assets/styles\.[0-9a-f]*\.css')"
          curl -fsSI "http://127.0.0.1:8080${css}" | grep -qi 'immutable'
          test "$(docker inspect -f '{{.Config.User}}' alondra1-landing:ci)" != "root"
      - name: Refuse to start without an environment
        run: |
          ! docker run --rm alondra1-landing:ci
          ! docker run --rm -e ALONDRA1_ENVIRONMENT=staging alondra1-landing:ci
      - name: Container logs
        if: always()
        run: docker logs landing-prod || true; docker logs landing-dev || true

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # gitleaks CLI (MIT), pinned and checksum-verified. The gitleaks GitHub Action needs a paid license for
      # repositories owned by an organization.
      - name: Secrets scan (gitleaks)
        run: |
          curl -fsSL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git --redact --verbose --exit-code 1 .
