name: release

# Every merge to main: the checks, then one immutable image (both variants; tagged with the commit SHA, never
# "latest") with SBOM and provenance, scanned, signed by digest and attested. alondra1-infra is asked to record it for
# dev; it verifies the signature itself, deploys dev and promotes to prod only after approval. This repository holds
# no deployment credentials (the shared-landing deployment was removed: spec v1.1 §5.2).
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      registry: ${{ steps.meta.outputs.registry }}
      version: ${{ steps.meta.outputs.version }}
      compose_sha256: ${{ steps.meta.outputs.compose_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: meta
        run: |
          echo "version=$(git describe --tags --always)-main" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "compose_sha256=$(sha256sum compose.yaml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.registry }}/alondra1-landing:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Scan (fail on fixable high or critical vulnerabilities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.registry }}/alondra1-landing@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign by digest
        run: cosign sign --yes "${{ steps.meta.outputs.registry }}/alondra1-landing@${{ steps.build.outputs.digest }}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.registry }}/alondra1-landing
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  record-for-dev:
    needs: image
    runs-on: ubuntu-24.04
    environment: dev
    steps:
      - id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ vars.INFRA_REPOSITORY_OWNER }}
          repositories: alondra1-infra
      - name: Dispatch release-built
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PAYLOAD: >-
            {"event_type": "release-built", "client_payload": {
              "component": "www", "repo": "${{ github.repository }}", "commit": "${{ github.sha }}",
              "version": "${{ needs.image.outputs.version }}",
              "images": {"landing": "${{ needs.image.outputs.registry }}/alondra1-landing@${{ needs.image.outputs.digest }}"},
              "compose": {"path": "compose.yaml", "sha256": "${{ needs.image.outputs.compose_sha256 }}"}}}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ vars.INFRA_REPOSITORY_OWNER }}/alondra1-infra/dispatches" -d "$PAYLOAD"
