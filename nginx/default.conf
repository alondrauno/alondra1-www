# Alondra1 landing: static files on :8080 behind the shared Traefik (TLS and www -> apex happen there).
server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  absolute_redirect off;          # never leak the internal :8080 in Location headers
  charset utf-8;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_vary on;
  gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

  include /etc/nginx/conf.d/security-headers.inc;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Fingerprinted CSS/JS: safe to cache forever.
  location /assets/ {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location /images/ {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "public, max-age=604800" always;
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
  location = /404.html { internal; }
}
